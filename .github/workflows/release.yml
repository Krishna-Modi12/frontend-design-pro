name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history, because Stage 4.5 asserts the tagged commit IS main's head
      # — the check that would have stopped v14.4.2, whose tag named a commit two
      # behind main. The guard resolves main through `git fetch origin main` and
      # FETCH_HEAD so it works even shallow, but a depth-1 checkout shares no
      # history with main, and the "N ahead, M behind" diagnostic degrades to
      # "? ahead, ? behind" exactly when someone needs to read it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # `npm ci`, not `npm install`: this job produces the artifact people
      # download, so it resolves from the lockfile or it does not run.
      - run: npm ci

      # Gate 9 builds demo/showcase against its real vendor typings, but it can
      # only do that if the dependencies are there — without them it warns and
      # skips, which would mean the published archive was never checked against
      # the one demo that claims to run. Installing them here is what makes
      # "all 10 gates" true of a release rather than only of a push to main.
      - name: Install showcase dependencies (so Gate 9 runs, not skips)
        working-directory: demo/showcase
        run: npm ci

      - name: Build gated archive (all 10 gates must pass)
        run: python3 scripts/build_release.py

      # build_release.py writes docs/RELEASE_NOTES-v<version>.md in Stage 7.
      # Resolve it from the tag so the workflow does not need editing per release.
      - name: Locate release notes
        id: notes
        run: echo "path=docs/RELEASE_NOTES-${GITHUB_REF_NAME}.md" >> "$GITHUB_OUTPUT"

      - name: Publish release with .skill attached
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.skill
          generate_release_notes: true
          body_path: ${{ steps.notes.outputs.path }}
