name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: npm install

      - name: Build gated archive (all 8 gates must pass)
        run: python3 scripts/build_release.py

      # build_release.py writes docs/RELEASE_NOTES-v<version>.md in Stage 7.
      # Resolve it from the tag so the workflow does not need editing per release.
      - name: Locate release notes
        id: notes
        run: echo "path=docs/RELEASE_NOTES-${GITHUB_REF_NAME}.md" >> "$GITHUB_OUTPUT"

      - name: Publish release with .skill attached
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.skill
          generate_release_notes: true
          body_path: ${{ steps.notes.outputs.path }}
