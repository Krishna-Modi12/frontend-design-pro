name: Deploy showcase to Pages

# The two demos in demo/ that actually run are the only artifacts here a
# stranger can evaluate without installing anything. Both were reachable by
# nobody until this workflow existed.
#
# Both are now samples of what the pack produces, for fictional products —
# demo/showcase is "Nexus" and demo/landing-page is "Switchyard". Neither is the
# pack's own homepage, so neither has a claim on the root beyond being the one a
# visitor should meet first. That is the showcase: it is the fuller artifact,
# with a WebGL hero, a validated form and five sections against the landing
# page's four.
#
# The landing page briefly sat at the root while it was still written as this
# pack's homepage. It is not that any more, and a fictional deploy-pipeline
# product at the front door drops people onto a convincing fake startup with no
# idea why — the exact failure the previous arrangement was written to avoid,
# pointed the other way. README.md is the front door; this is the gallery.

on:
  push:
    branches: [main]
    paths:
      - 'demo/showcase/**'
      - 'demo/landing-page/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race to publish. Not cancel-in-progress: a half-finished
# deploy that gets cancelled can leave the site serving a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # A project site is served from /<repo>. Next bakes asset URLs at build time,
  # so this has to be known here rather than resolved in the browser.
  BASE_PATH: /frontend-design-pro

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            demo/landing-page/package-lock.json
            demo/showcase/package-lock.json

      # `npm ci` alone, matching the showcase job in ci.yml: an `|| npm install`
      # fallback makes a stale lockfile look like a passing build.
      - name: Install landing-page dependencies
        working-directory: demo/landing-page
        run: npm ci

      - name: Install showcase dependencies
        working-directory: demo/showcase
        run: npm ci

      - name: Export the showcase (site root)
        working-directory: demo/showcase
        env:
          NEXT_OUTPUT_EXPORT: '1'
          NEXT_BASE_PATH: ${{ env.BASE_PATH }}
        run: npx next build

      # NEXT_PUBLIC_BASE_PATH is separate from NEXT_BASE_PATH on purpose. Next
      # rewrites its own asset URLs from the config, but not the ones handed to
      # fetch() — app/page.tsx reads /api/site/overview and needs the prefix
      # inlined into the client bundle to find it.
      - name: Export the landing page (/landing-page/)
        working-directory: demo/landing-page
        env:
          NEXT_OUTPUT_EXPORT: '1'
          NEXT_BASE_PATH: ${{ env.BASE_PATH }}/landing-page
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE_PATH }}/landing-page
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npx next build

      - name: Compose the site
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r demo/showcase/out/. site/
          mkdir -p site/landing-page
          cp -r demo/landing-page/out/. site/landing-page/
          # Pages serves the uploaded artifact directly rather than running
          # Jekyll, so this is belt-and-braces — but Jekyll strips directories
          # beginning with an underscore, and everything Next emits is in _next/.
          touch site/.nojekyll

      # Gate 9 builds a server bundle of one of these apps; this job ships static
      # exports of both. That split is only safe if something checks the export,
      # and this is that something.
      #
      # It resolves every asset each page references against the files actually
      # in the upload, rather than pattern-matching the HTML — the failure being
      # gated is "does this 404 when served", and the honest way to ask that is
      # to look for the file. A missing or wrong base path renders as unstyled
      # HTML that still returns 200, which reads like a CSS bug and is a routing
      # one. Composing two apps at different prefixes makes it likelier, not
      # less: the showcase's assets have to carry /showcase and the landing
      # page's must not.
      - name: Verify the composed site would actually serve
        run: python3 .github/workflows/verify_pages_site.py site "$BASE_PATH"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
