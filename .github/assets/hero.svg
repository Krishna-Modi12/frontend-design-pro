<line x1="910" y1="334" x2="280" y2="420"/>
<line x1="910" y1="334" x2="398" y2="420"/>
<line x1="910" y1="334" x2="516" y2="420"/>
<line x1="910" y1="334" x2="634" y2="420"/>
