<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="frontend-design-pro — a skill pack for AI coding agents. A component on an audit bench: a scan beam sweeps it while constraints for type scale, contrast, focus ring and colour space resolve to green checks, ending on a pass.">
<title>frontend-design-pro — machine-enforced frontend design</title>
<defs>
  <radialGradient id="bloom" cx="0.62" cy="0.42" r="0.72">
    <stop offset="0" stop-color="#16294D"/>
    <stop offset="1" stop-color="#070A12"/>
  </radialGradient>
  <linearGradient id="faceFill" x1="0" y1="0" x2="0.35" y2="1">
    <stop offset="0" stop-color="#17223A"/>
    <stop offset="1" stop-color="#111A2B"/>
  </linearGradient>
  <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3D5580" stop-opacity="0"/>
    <stop offset="0.45" stop-color="#3D5580" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#3D5580" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="accentRule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5AA9FF"/>
    <stop offset="1" stop-color="#5AA9FF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="beamFill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5AA9FF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#5AA9FF" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#5AA9FF" stop-opacity="0"/>
  </linearGradient>
  <!-- The trail sits ABOVE the core because the beam travels downward, so the
       haze is what it has already passed. Kept faint: at 0.30 the three stacked
       beam layers merged into a solid bar and the whole thing read as a progress
       indicator rather than a light moving over a surface. -->
  <linearGradient id="beamHaze" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5AA9FF" stop-opacity="0"/>
    <stop offset="0.8" stop-color="#5AA9FF" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#5AA9FF" stop-opacity="0"/>
  </linearGradient>

  <radialGradient id="floorFade" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
    <stop offset="0.55" stop-color="#fff" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="floorMask">
    <ellipse cx="910" cy="354" rx="620" ry="150" fill="url(#floorFade)"/>
  </mask>

  <!-- Generous explicit filter regions. The default region is the bounding box
       plus 10%, which clips a blur this wide and leaves a visible square edge
       around the shadow. -->
  <filter id="drop" x="-40%" y="-40%" width="180%" height="200%">
    <feGaussianBlur stdDeviation="20"/>
  </filter>
  <filter id="glow" x="-120%" y="-900%" width="340%" height="1900%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>

<style>
  /* Every animated element RESTS in its finished state and the stylesheet moves
     it away and back, so losing this block leaves a completed audit rather than
     a dim panel. See the header note. */
  .r    { animation: 0s linear infinite; animation-duration: 4.6s; }
  .r0 { animation-name: row0; }
  .r1 { animation-name: row1; }
  .r2 { animation-name: row2; }
  .r3 { animation-name: row3; }
  @keyframes row0 {
    0%, 15.2%      { opacity: 0.22; }
    17.7%, 93% { opacity: 1; }
    100%                 { opacity: 0.22; }
  }
  @keyframes row1 {
    0%, 32.2%      { opacity: 0.22; }
    34.7%, 93% { opacity: 1; }
    100%                 { opacity: 0.22; }
  }
  @keyframes row2 {
    0%, 49.8%      { opacity: 0.22; }
    52.3%, 93% { opacity: 1; }
    100%                 { opacity: 0.22; }
  }
  @keyframes row3 {
    0%, 66.8%      { opacity: 0.22; }
    69.3%, 93% { opacity: 1; }
    100%                 { opacity: 0.22; }
  }

  .pass { animation: pass 4.6s infinite; }
  @keyframes pass {
    0%, 78%      { opacity: 0; transform: translateY(3px); }
    81%, 93% { opacity: 1; transform: translateY(0); }
    100%                 { opacity: 0; transform: translateY(3px); }
  }

  /* The beam. Travels only between 6% and 76%, then fades —
     the remainder of the cycle is the hold that makes the result legible. */
  .beam { animation: sweep 4.6s infinite; }
  @keyframes sweep {
    0%              { transform: translateY(0); opacity: 0; }
    6%  { transform: translateY(0); opacity: 1; }
    76%    { transform: translateY(182px); opacity: 1; }
    82% { transform: translateY(182px); opacity: 0; }
    100%            { transform: translateY(182px); opacity: 0; }
  }

  /* A slow lift on the whole bench. Three pixels — enough to stop the panel
     reading as pasted onto the background, small enough not to compete with the
     beam for attention. */
  .bench { animation: lift 7s infinite ease-in-out; }
  @keyframes lift {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }

  .mote { animation: drift 9s var(--m) infinite ease-in-out; }
  @keyframes drift {
    0%, 100% { transform: translateY(6px); opacity: 0.15; }
    50%      { transform: translateY(-14px); opacity: 0.55; }
  }

  /* Resolves to the same finished state the stylesheet-dropped case does: rows
     lit, checks green, PASS shown, beam gone. The beam is the decoration, and
     it is the only thing this costs. */
  @media (prefers-reduced-motion: reduce) {
    .r, .pass, .beam, .bench, .mote { animation: none; }
    .beam { opacity: 0; }
  }

</style>

<rect width="1200" height="420" fill="url(#bloom)"/>

<g mask="url(#floorMask)" stroke="#1B2740" stroke-width="1" fill="none">
<line x1="910" y1="334" x2="-900" y2="420"/>
<line x1="910" y1="334" x2="-782" y2="420"/>
<line x1="910" y1="334" x2="-664" y2="420"/>
<line x1="910" y1="334" x2="-546" y2="420"/>
