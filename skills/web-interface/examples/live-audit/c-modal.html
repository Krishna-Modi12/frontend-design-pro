<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>c-modal — custom modal does not return focus to its trigger on close</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font: 16px/1.5 system-ui, sans-serif;
      background: oklch(0.15 0.006 265);
      color: oklch(0.92 0.005 265);
      padding: 48px 24px;
    }
    button {
      font: inherit;
      min-height: 44px;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid oklch(0.4 0.02 265);
      background: oklch(0.26 0.02 265);
      color: inherit;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid oklch(0.8 0.12 250); outline-offset: 2px; }
    .backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: oklch(0 0 0 / 0.5);
    }
    .backdrop[data-open] { display: flex; }
    .modal {
      background: oklch(0.2 0.01 265);
      border: 1px solid oklch(0.35 0.01 265);
      border-radius: 14px;
      padding: 24px;
      max-width: 360px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Danger zone</h1>
    <button id="open" type="button">Delete project</button>

    <div class="backdrop" id="backdrop">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
        <h2 id="m-title">Delete this project?</h2>
        <p>This cannot be undone.</p>
        <button id="close" type="button">Cancel</button>
      </div>
    </div>
  </main>

  <script>
    const open = document.getElementById('open');
    const close = document.getElementById('close');
    const backdrop = document.getElementById('backdrop');

    open.addEventListener('click', () => {
      backdrop.setAttribute('data-open', '');
      close.focus();
    });

    // DEFECT (the close handler below, line 76): hiding the modal leaves focus
    // on #close, which is now display:none, so the browser drops focus to
    // <body>. A keyboard user is sent to the top of the document with no
    // context. The source has a focusable trigger, aria-modal, a label and a
    // focus-visible style — every static a11y check passes. Only reading
    // document.activeElement after the close reveals it. The fix is one line:
    // open.focus() here.
    close.addEventListener('click', () => {
      backdrop.removeAttribute('data-open');
    });
  </script>
</body>
</html>
